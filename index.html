<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Futurity del Coleo</title>
  <meta name="description" content="Futurity del Coleo — El Caballo del Futuro. Próximamente.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;1,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-900: #062a12;
      --green-700: #0b5a24;
      --lime: #8bdc2b;
      --white: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: radial-gradient(ellipse at top, var(--green-700) 0%, var(--green-900) 70%);
      color: var(--white);
      font-family: "Barlow Condensed", system-ui, sans-serif;
      text-align: center;
    }
    .badge {
      width: 140px; height: 140px;
      margin: 0 auto 28px;
      border-radius: 50%;
      border: 4px solid var(--white);
      display: grid; place-items: center;
      font-size: 64px;
      box-shadow: 0 0 60px rgba(139, 220, 43, .35);
    }
    .kicker {
      letter-spacing: .3em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--lime);
    }
    h1 {
      font-size: clamp(48px, 12vw, 110px);
      font-weight: 900;
      font-style: italic;
      line-height: .95;
      text-transform: uppercase;
      margin: 8px 0 16px;
    }
    .stages {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
      margin: 24px 0;
    }
    .stages span {
      border: 1px solid rgba(255, 255, 255, .4);
      border-radius: 999px;
      padding: 6px 16px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .stages span:last-child { background: var(--lime); color: var(--green-900); border-color: var(--lime); }
    p { font-size: 20px; opacity: .85; }
    a { color: var(--lime); }
    footer { margin-top: 40px; font-size: 16px; opacity: .7; }
  </style>
</head>
<body>
  <main>
    <div class="badge" aria-hidden="true">🐎</div>
    <div class="kicker">Caballo del Futuro · Est. 2022</div>
    <h1>Futurity<br>del Coleo</h1>
    <div class="stages">
      <span>Caballo del Futuro 1</span>
      <span>Caballo del Futuro 2</span>
      <span>Futurity</span>
    </div>
    <p>Nuestra nueva casa en la web está en camino.<br>Resultados en vivo, generaciones y cada ejemplar.</p>
    <footer>
      <a href="https://www.instagram.com/futuritydelcoleo_oficial/">Instagram</a> ·
      <a href="https://www.youtube.com/@futuritydelcoleo">YouTube</a> ·
      <a href="mailto:info@futuritydelcoleo.com">info@futuritydelcoleo.com</a>
    </footer>
  </main>
</body>
</html>
